<script>
  (function () {
    var nav = document.querySelector(".ccgrid2027-site-nav");

    if (!nav) {
      return;
    }

    var pageIdMatch = document.body.className.match(/(?:^|\s)page-id-(\d+)(?:\s|$)/);

    if (pageIdMatch) {
      var currentLink = nav.querySelector('[data-page-id="' + pageIdMatch[1] + '"]');

      if (currentLink) {
        currentLink.setAttribute("aria-current", "page");

        var currentDropdown = currentLink.closest(".ccgrid2027-site-dropdown");
        if (currentDropdown) {
          var currentLabel = currentDropdown.querySelector(".ccgrid2027-site-dropdown-label");
          if (currentLabel) {
            currentLabel.classList.add("is-current");
          }
        }
      }
    }

    var toggles = nav.querySelectorAll(".ccgrid2027-site-dropdown-toggle");

    document.addEventListener("click", function (event) {
      var clickedDropdown = event.target.closest(".ccgrid2027-site-dropdown");

      toggles.forEach(function (toggle) {
        if (!clickedDropdown || !clickedDropdown.contains(toggle)) {
          toggle.checked = false;
        }
      });
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        toggles.forEach(function (toggle) {
          toggle.checked = false;
        });
      }
    });
  }());
</script>
